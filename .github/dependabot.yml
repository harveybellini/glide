version: 2

updates:
  # CI pins actions to commit SHAs; Dependabot keeps those pins current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly

  # The Python dependencies live in uv.lock; without this entry a pytest
  # advisory (GHSA-6w46-j5rx-g56g) never raised a pull request, so it sat on
  # the default branch until it was found by hand.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly

  # Local MCP tool installs. The GitHub server is archived upstream and pins
  # its own transitive SDK exactly, so it needs watching even though it is not
  # part of the deployed app.
  - package-ecosystem: npm
    directory: "/tools/mcp/github"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/tools/mcp/playwright"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/tools/mcp/google-calendar"
    schedule:
      interval: weekly
