[project]
name = "glide-calendar-agent"
version = "0.1.0"
description = "A calendar agent that reserves time to travel between appointments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.43.90",
    "cryptography>=50.0.1",
    "fastapi>=0.116,<1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.57.1",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "pydantic>=2.11,<3",
    "strands-agents>=1.55.0",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pillow>=12.3.0",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/glide"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
