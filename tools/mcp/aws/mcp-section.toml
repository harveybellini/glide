# AWS MCP Server (Agent Toolkit for AWS) over the official SigV4 proxy.
#
# This replaces the four legacy awslabs Docker servers (cloudwatch-logs,
# dynamodb, sqs, lambda). One managed endpoint now provides:
#   - aws___run_script: sandboxed Python with call_boto3, i.e. every AWS API
#     (CloudWatch Logs, DynamoDB, SQS, CloudFormation, CloudFront, Budgets...)
#   - the read-only serverless capability: diagnose / search_logs /
#     get_live_config / get_recent_changes for Lambda and its connected
#     SQS, SNS, DynamoDB, API Gateway, EventBridge, and Step Functions resources
#   - AWS documentation, regional availability, and AWS skills tools
#
# Install: uv/uvx must be on PATH. The pinned proxy is fetched on first start;
# pre-warm it (and check the version) with
#   powershell -ExecutionPolicy Bypass -File scripts/install-mcps.ps1
#
# Credentials: AWS_PROFILE and AWS_REGION are forwarded from the environment.
# SigV4 signing always uses the endpoint's own region (eu-central-1); the
# profile's configured region (eu-west-1 for Glide) becomes the session's
# default AWS region, so tool calls default to the deployed stack's region.
# Only eu-central-1 and us-east-1 endpoints exist (verified 11 September 2026).
[mcp_servers.aws-mcp]
command = "uvx"
args = [
    "mcp-proxy-for-aws-cli@1.6.6",
    "https://aws-mcp.eu-central-1.api.aws/mcp",
    "--log-level",
    "ERROR",
]
env_vars = ["AWS_PROFILE", "AWS_REGION"]
enabled = true
required = false
startup_timeout_sec = 90
default_tools_approval_mode = "writes"
