# Official awslabs MCP servers (Docker transport, digest-pinned).
# Prerequisite: tools/mcp/aws/install-aws-mcps.ps1  (pulls the images)
# Credentials: forward AWS_PROFILE and AWS_REGION and mount ~/.aws read-only.
# Use a dedicated least-privilege SSO profile; see SETUP.md.

[mcp_servers.cloudwatch-logs]
command = "docker"
args = [
    "run", "-i", "--rm",
    "-e", "AWS_PROFILE", "-e", "AWS_REGION",
    "-v", "<USER_HOME>/.aws:/app/.aws:ro",
    "public.ecr.aws/awslabs-mcp/awslabs/cloudwatch-mcp-server@sha256:477bfd0885228340a0979ddabcca13f4e7df0fce39cbb128bf7cfa21318de62a",
]
env_vars = ["AWS_PROFILE", "AWS_REGION"]
enabled = true
required = false
startup_timeout_sec = 60
default_tools_approval_mode = "writes"

