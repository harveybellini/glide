AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Glide base stack: private S3/CloudFront web app, API Lambda, SQS FIFO queue,
  worker and scheduled dispatcher Lambdas, and a single DynamoDB state table.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  BedrockModelId:
    Type: String
    Description: Confirmed, access-tested Bedrock model id.
  GoogleClientId:
    Type: String
    NoEcho: true
    Description: Google OAuth web client id.
  GoogleClientSecretArn:
    Type: String
    AllowedPattern: "^arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$"
    ConstraintDescription: >-
      Must be the ARN of the Secrets Manager secret holding the Google OAuth
      client secret. Use scripts/deploy.ps1 to store the value safely.
    Description: >-
      ARN of the Secrets Manager secret holding the Google OAuth client
      secret. The functions read the value at runtime; it is never injected
      into a Lambda environment variable.
  FrontendOrigin:
    Type: String
    Default: https://frontend.invalid
    Description: Public frontend origin used for the OAuth success redirect and CORS.
  AlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Optional email address subscribed to the alarm topic. Leave empty to
      create the alarms without a subscription.
  NotificationFromEmail:
    Type: String
    Default: ""
    Description: >-
      Optional Amazon SES identity used as the "From" address for
      "needs your decision" emails. Leave empty to deploy without
      notifications. The identity must be verified in SES (the stack requests
      verification and AWS emails the address) before the worker can send.

Conditions:
  HasAlarmEmail: !Not
    - !Equals
      - !Ref AlarmEmail
      - ""
  HasNotificationFromEmail: !Not
    - !Equals
      - !Ref NotificationFromEmail
      - ""

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256

Resources:
  # --------------------------------------------------------------- web assets

  UiBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  UiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-ui-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${UiBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        DefaultCacheBehavior:
          TargetOriginId: ui
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, POST, PATCH, PUT, DELETE, OPTIONS, HEAD]
            CachedMethods: [GET, HEAD]
            # AWS managed CachingDisabled policy: every request reaches the origin.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed AllViewerExceptHostHeader policy for API Gateway origins.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        Origins:
          - Id: ui
            DomainName: !Sub ${UiBucket}.s3.${AWS::Region}.${AWS::URLSuffix}
            S3OriginConfig: {}
            OriginAccessControlId: !Ref UiOriginAccessControl
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            OriginPath: !Sub /${Stage}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # -------------------------------------------------------------- state table

  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: user_pk
          AttributeType: S
        - AttributeName: user_sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: user-index
          KeySchema:
            - AttributeName: user_pk
              KeyType: HASH
            - AttributeName: user_sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ------------------------------------------------------------- job pipeline

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 300
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Random session-cookie encryption secret for Glide.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: GLIDE_SESSION_SECRET
        PasswordLength: 32
        ExcludePunctuation: true

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 30

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-worker
      RetentionInDays: 30

  DispatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-dispatcher
      RetentionInDays: 30

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-api-access
      RetentionInDays: 30

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","requestTime":"$context.requestTime","ip":"$context.identity.sourceIp","httpMethod":"$context.httpMethod","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency","userAgent":"$context.identity.userAgent","errorMessage":"$context.error.message"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      # No per-route throttling: the API is a single catch-all `ANY /{proxy+}`
      # route in front of the FastAPI app, so a route key such as
      # "POST /api/demo/session" does not exist and CloudFormation rejects the
      # stage update ("settings for the Route ... does not exist").

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: glide.deploy.api.handler
      CodeUri: ../backend/glide-lambda.zip
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          GLIDE_ENV: production
          GLIDE_API_STAGE: !Ref Stage
          GLIDE_TABLE_NAME: !Ref StateTable
          GLIDE_QUEUE_URL: !Ref JobQueue
          GLIDE_FRONTEND_ORIGIN: !Ref FrontendOrigin
          GLIDE_SECURE_COOKIES: "true"
          GLIDE_SESSION_SECRET_ARN: !Ref SessionSecret
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET_ARN: !Ref GoogleClientSecretArn
          GOOGLE_REDIRECT_URI: !Sub ${FrontendOrigin}/api/auth/google/callback
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobQueue.QueueName
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref SessionSecret
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GoogleClientSecretArn
            - Effect: Allow
              Action:
                - secretsmanager:CreateSecret
                - secretsmanager:DescribeSecret
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
                - secretsmanager:UpdateSecret
                - secretsmanager:DeleteSecret
              Resource: !Sub >-
                arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glide/tokens/*
            - Effect: Allow
              Action: geo-places:SearchText
              Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: any

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: glide.deploy.worker.handler
      CodeUri: ../backend/glide-lambda.zip
      # One queue message must finish before the queue's 300-second visibility
      # timeout so the message is never redelivered mid-run; the agent's own
      # 200-second deadline fires first and persists a safe failure code.
      Timeout: 240
      LoggingConfig:
        LogGroup: !Ref WorkerLogGroup
      Environment:
        Variables:
          GLIDE_ENV: production
          GLIDE_TABLE_NAME: !Ref StateTable
          GLIDE_QUEUE_URL: !Ref JobQueue
          GLIDE_AGENT_MODE: bedrock
          GLIDE_AGENT_DEADLINE_SECONDS: "200"
          GLIDE_AGENT_TURNS: "16"
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET_ARN: !Ref GoogleClientSecretArn
          GLIDE_NOTIFICATION_FROM: !Ref NotificationFromEmail
          GLIDE_PUBLIC_BASE_URL: !Ref FrontendOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub >-
                arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:glide/tokens/*
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref GoogleClientSecretArn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub >-
                  arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0
                - !Sub >-
                  arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*
            - Effect: Allow
              Action:
                - geo-places:SearchText
                - geo-places:GetPlace
                - geo-routes:CalculateRoutes
              Resource: "*"
            # Scoped to the single verified sending identity. With an empty
            # parameter the ARN matches nothing, and no code path sends mail.
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub >-
                arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${NotificationFromEmail}
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 1

  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: glide.deploy.dispatcher.handler
      CodeUri: ../backend/glide-lambda.zip
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref DispatcherLogGroup
      Environment:
        Variables:
          GLIDE_TABLE_NAME: !Ref StateTable
          GLIDE_QUEUE_URL: !Ref JobQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobQueue.QueueName
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)

  # ------------------------------------------------------------------ alarms

  # A verified SES identity is the only thing standing between Glide and
  # sending "needs your decision" mail. Creating the resource asks SES to
  # verify the address; until the owner clicks the link, sends stay disabled.
  DecisionEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasNotificationFromEmail
    Properties:
      EmailIdentity: !Ref NotificationFromEmail

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Glide alarms
      KmsMasterKeyId: alias/aws/sns

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  DlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dlq-depth
      AlarmDescription: >-
        A queue message reached the dead-letter queue after three attempts.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-worker-errors
      AlarmDescription: The queue worker reported one or more errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-5xx
      AlarmDescription: The HTTP API returned server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
        - Name: Stage
          Value: !Ref Stage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

  ApiThrottleMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiAccessLogGroup
      # HTTP APIs do not publish a throttle metric, so derive one from the
      # access log entries API Gateway returns with 429 Too Many Requests.
      FilterPattern: '{ $.status = "429" }'
      MetricTransformations:
        - MetricNamespace: Glide/Api
          MetricName: ThrottledRequests
          MetricValue: "1"
          DefaultValue: 0

  ApiThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-throttles
      AlarmDescription: The HTTP API throttled one or more requests.
      Namespace: Glide/Api
      MetricName: ThrottledRequests
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  UiBucketName:
    Value: !Ref UiBucket
  DistributionDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
  DistributionId:
    Value: !Ref CloudFrontDistribution
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Stage}
  StateTableName:
    Value: !Ref StateTable
  JobQueueUrl:
    Value: !Ref JobQueue
